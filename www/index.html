	<body class="background">
	     <div class="weather-container ">
		 <h1 class="heading text-center">SkyCast</h1>
		 <p id="networkStatus" class="text-center text-white font-weight-bold mb-3"></p>
		 <div class="container">
		 <div class="row justify-content-center">
		 <div class="col-lg-5 col-md-7 col-sm-10 col-12">
		 <div class="search-box">
		 <div class="input-group">
		    <input type="text" class="form-control" id="cityinput" placeholder="Enter City">
			<button id="searchbtn" class="btn btn-primary button1 px-4">Search</button>
		</div>
		 </div>
		 <div id="suggestions" class="w-100">
		 </div>
		 <div class="card p-4 shadow mt-3 weather-card">
		 <h2 id="temp">--°C</h2>
		 <div class="details">
		   <p id="city">Search for a city</p>
		   <p id="humidity">Humidity:--</p>
		   <p id="wind">Wind:--</p>
		   <p id="feels">Feels like:--</p>
		   <p id="description">Description:--</p>
		         </div>
		       </div>
		     </div>
		   </div>
		  </div>
		</div>
	 <script src="script.js" defer></script>

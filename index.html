<!DOCTYPE html>
<html>
    <head>
	   <meta name="viewport" content="width=device-width,initial-scale=1.0">
	   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
	   <link rel="stylesheet" href="style.css">
	   <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
       <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
	</head>
	<body class="background">
	     <div class="weather-container ">
		 <h1 class="heading text-center">Weather App</h1>
		 <div class="container">
		 <div class="row justify-content-center">
		 <div class="col-lg-5 col-md-7 col-sm-10 col-12">
		 <div class="search-box">
		 <div class="input-group">
		    <input type="text" class="form-control" id="cityinput" placeholder="Enter City">
			<button id="searchbtn" class="btn btn-primary button1 px-4">Search</button>
		</div>
		 </div>
		 <div id="suggestions" class="w-100">
		 </div>
		 <div class="card p-4 shadow mt-3 weather-card">
		 <h2 id="temp">--°C</h2>
		 <div class="details">
		   <p id="city">Search for a city</p>
		   <p id="humidity">Humidity:--</p>
		   <p id="wind">Wind:--</p>
		   <p id="feels">Feels like:--</p>
		   <p id="description">Description:--</p>
		         </div>
		       </div>
		     </div>
		   </div>
		  </div>
		</div>
		<div class="container mt-5">
		<h2 class="text-white mb-4">
		Latest Weather News
		</h2>
		<div id="newsContainer" class="row">
		  
		</div>
		</div>
	 <script src="script.js" defer></script>
	</body>
</html>
